<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Quiz Generator - EduAI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="navbar"></nav>

  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 32px; padding: 0 8px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
          <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
        </svg>
        <span style="font-size: 1.2rem; font-weight: 800;">Instructor Portal</span>
      </div>
      
      <a href="instructor-dashboard.html" class="sidebar-link active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg> Manage Courses
      </a>
      <a href="create-course.html" class="sidebar-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="16"></line>
          <line x1="8" y1="12" x2="16" y2="12"></line>
        </svg> Create Course
      </a>
      <a href="profile.html" class="sidebar-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg> My Profile
      </a>
      
      <button id="sidebar-logout-btn" class="sidebar-link" style="margin-top: auto;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg> Log Out
      </button>
    </aside>

    <!-- Main Panel Content -->
    <main class="main-content">
      <div style="margin-bottom: 32px;">
        <a href="instructor-dashboard.html" style="display: inline-flex; align-items: center; gap: 8px; color: var(--text-secondary); text-decoration: none; font-weight: 600; margin-bottom: 16px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg> Back to Dashboard
        </a>
        <h1 style="font-size: 2.2rem; display: flex; align-items: center; gap: 12px;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg> AI Quiz Generator
        </h1>
        <p style="color: var(--text-secondary); margin-top: 4px;">Provide course notes/content. Our LLM will draft 5 custom structured MCQs.</p>
      </div>

      <div style="display: grid; grid-template-columns: 1.2fr 1.8fr; gap: 32px;">
        <!-- Note inputs form -->
        <div class="glass-card" style="padding: 32px; height: fit-content;">
          <h2 style="font-size: 1.3rem; margin-bottom: 24px;">Submit Core Content</h2>
          
          <form id="quiz-gen-form">
            <div class="form-group">
              <label class="form-label" for="quizTitle">Quiz Name / Topic</label>
              <input
                id="quizTitle"
                type="text"
                class="form-input"
                required
              />
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
              <label class="form-label" for="content">Course Notes (Text Context)</label>
              <textarea
                id="content"
                class="form-input"
                rows="8"
                placeholder="Paste textbook definitions, lecture transcripts, or notes for the AI model to read..."
                required
                style="resize: vertical; min-height: 200px;"
              ></textarea>
            </div>

            <button id="gen-btn" type="submit" class="btn btn-secondary" style="width: 100%;">
              Generate MCQ Quiz
            </button>
          </form>
        </div>

        <!-- AI generated preview panel -->
        <div class="glass-card" style="padding: 32px;">
          <h2 style="font-size: 1.3rem; margin-bottom: 24px;">AI Preview & Questions Log</h2>
          
          <div id="preview-panel">
            <div style="text-align: center; padding: 60px 20px; color: var(--text-muted);">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin: 0 auto 12px;">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
              </svg>
              <p>Provide course text on the left panel to execute the AI generator.</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="js/quiz-generator.js"></script>
</body>
</html>
