<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Course - EduAI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="navbar"></nav>

  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 32px; padding: 0 8px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
          <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
        </svg>
        <span style="font-size: 1.2rem; font-weight: 800;">Instructor Portal</span>
      </div>
      
      <a href="instructor-dashboard.html" class="sidebar-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg> Manage Courses
      </a>
      <a href="create-course.html" class="sidebar-link active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="16"></line>
          <line x1="8" y1="12" x2="16" y2="12"></line>
        </svg> Create Course
      </a>
      <a href="profile.html" class="sidebar-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg> My Profile
      </a>
      
      <button id="sidebar-logout-btn" class="sidebar-link" style="margin-top: auto;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg> Log Out
      </button>
    </aside>

    <!-- Main Panel Content -->
    <main class="main-content">
      <h1 style="font-size: 2.2rem; margin-bottom: 12px;">Publish a Course</h1>
      <p style="color: var(--text-secondary); margin-bottom: 40px;">Fill in the fields below. Admin verification will process new templates within 24 hours.</p>

      <div class="glass-card" style="padding: 32px; max-width: 800px;">
        <div id="error-alert" style="display: none; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 8px; padding: 12px 16px; color: var(--danger); font-size: 0.9rem; margin-bottom: 24px;"></div>

        <form id="create-course-form">
          <div class="form-group">
            <label class="form-label" for="title">Course Title</label>
            <input
              id="title"
              type="text"
              class="form-input"
              placeholder="e.g. Master Clean Code & OOP Principles"
              required
            />
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
              <label class="form-label" for="category">Category</label>
              <select id="category" class="form-select" required>
                <option value="Software Development">Software Development</option>
                <option value="Data Science">Data Science</option>
                <option value="Business">Business</option>
                <option value="Design">Design</option>
                <option value="Marketing">Marketing</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="price">Price (Rupees)</label>
              <input
                id="price"
                type="number"
                class="form-input"
                min="0"
                placeholder="e.g. 499 (0 for free)"
                value="0"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="skillsTags">Skills / Tags (Comma separated)</label>
            <input
              id="skillsTags"
              type="text"
              class="form-input"
              placeholder="e.g. Java, OOP, Collections, Abstraction"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="thumbnailUrl">Thumbnail URL</label>
            <input
              id="thumbnailUrl"
              type="url"
              class="form-input"
              placeholder="https://images.unsplash.com/photo-..."
            />
          </div>

          <div class="form-group" style="margin-bottom: 32px;">
            <label class="form-label" for="description">Full Description</label>
            <textarea
              id="description"
              class="form-input"
              rows="6"
              placeholder="Detail what students will learn, target audience, and pre-requisites..."
              required
              style="resize: vertical; min-height: 120px;"
            ></textarea>
          </div>

          <button
            id="submit-btn"
            type="submit"
            class="btn btn-primary"
            style="display: inline-flex; gap: 8px;"
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg> Submit Course
          </button>
        </form>
      </div>
    </main>
  </div>

  <script type="module" src="js/create-course.js"></script>
</body>
</html>
