<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - EduAI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(circle at center, rgba(99, 102, 241, 0.1) 0%, transparent 80%);">

  <div class="glass-card" style="width: 100%; max-width: 460px; padding: 40px;">
    <div style="text-align: center; margin-bottom: 32px;">
      <a href="index.html" style="text-decoration: none; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 16px;">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
        <span style="font-size: 1.8rem; color: #fff; font-weight: 800;">EduAI</span>
      </a>
      <h2 style="font-size: 1.6rem;">Create Account</h2>
      <p style="color: var(--text-secondary); margin-top: 8px; font-size: 0.9rem;">Join EduAI learning marketplace today</p>
    </div>

    <div id="error-alert" style="display: none; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 8px; padding: 12px 16px; color: var(--danger); font-size: 0.9rem; align-items: center; gap: 8px; margin-bottom: 24px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span id="error-text"></span>
    </div>

    <div id="success-alert" style="display: none; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); border-radius: 8px; padding: 12px 16px; color: var(--secondary); font-size: 0.9rem; margin-bottom: 24px;">
      <span id="success-text"></span>
    </div>

    <form id="register-form">
      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <div style="position: relative;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 16px; top: 15px;">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <input
            id="name"
            type="text"
            class="form-input"
            style="padding-left: 48px;"
            placeholder="John Doe"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <div style="position: relative;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 16px; top: 15px;">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          <input
            id="email"
            type="email"
            class="form-input"
            style="padding-left: 48px;"
            placeholder="you@example.com"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div style="position: relative;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 16px; top: 15px;">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input
            id="password"
            type="password"
            class="form-input"
            style="padding-left: 48px;"
            placeholder="Min 6 characters"
            minlength="6"
            required
          />
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 32px;">
        <label class="form-label" for="role">Select Account Type</label>
        <div style="position: relative;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 16px; top: 15px;">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="8.5" cy="7" r="4"></circle>
            <polyline points="17 11 19 13 23 9"></polyline>
          </svg>
          <select
            id="role"
            class="form-select"
            style="padding-left: 48px; height: 48px;"
            required
          >
            <option value="STUDENT">Student (Learn and quiz)</option>
            <option value="INSTRUCTOR">Instructor (Publish courses and generate quizzes)</option>
          </select>
        </div>
      </div>

      <button
        id="submit-btn"
        type="submit"
        class="btn btn-primary"
        style="width: 100%; padding: 12px; font-size: 1rem;"
      >
        Sign Up
      </button>
    </form>

    <p style="text-align: center; margin-top: 24px; color: var(--text-secondary); font-size: 0.9rem;">
      Already have an account? <a href="login.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign In</a>
    </p>
  </div>

  <script type="module" src="js/register.js"></script>
</body>
</html>
