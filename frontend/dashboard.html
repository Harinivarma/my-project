<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard - EduAI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="navbar"></nav>

  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 32px; padding: 0 8px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
        </svg>
        <span style="font-size: 1.2rem; font-weight: 800;">Student Hub</span>
      </div>
      
      <a href="dashboard.html" class="sidebar-link active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg> Dashboard
      </a>
      <a href="courses.html" class="sidebar-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
        </svg> Browse Catalog
      </a>
      <a href="recommendations.html" class="sidebar-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="7"></circle>
          <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
        </svg> NLP Recommendations
      </a>
      <a href="profile.html" class="sidebar-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg> My Profile
      </a>
      
      <button id="sidebar-logout-btn" class="sidebar-link" style="margin-top: auto;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg> Log Out
      </button>
    </aside>

    <!-- Main Panel Content -->
    <main class="main-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
        <div>
          <h1 style="font-size: 2.2rem;">Welcome, <span id="user-name">Student</span>!</h1>
          <p style="color: var(--text-secondary); margin-top: 4px;">Track your learning progress and acquired skills</p>
        </div>
        <a href="courses.html" class="btn btn-primary">Enroll in New Course</a>
      </div>

      <!-- Info Grid Cards -->
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 40px;">
        <div class="glass-card" style="padding: 24px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 8px;">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
          <h4 style="color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase;">Enrolled Courses</h4>
          <p id="enrolled-count" style="font-size: 2rem; font-weight: 800; margin-top: 8px; color: #fff;">0</p>
        </div>
        <div class="glass-card" style="padding: 24px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 8px;">
            <circle cx="12" cy="8" r="7"></circle>
            <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
          </svg>
          <h4 style="color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase;">Completed Courses</h4>
          <p id="completed-count" style="font-size: 2rem; font-weight: 800; margin-top: 8px; color: #fff;">0</p>
        </div>
        <div class="glass-card" style="padding: 24px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 8px;">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <h4 style="color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase;">Profile Account</h4>
          <p style="font-size: 1.1rem; font-weight: 700; margin-top: 16px; color: #fff;">Role: STUDENT</p>
        </div>
      </div>

      <!-- Enrolled Courses list -->
      <h2 style="font-size: 1.5rem; margin-bottom: 20px;">My Enrolled Courses</h2>

      <div id="enrolled-courses-container">
        <div style="display: flex; justify-content: center; padding: 40px;">
          <div class="spinner"></div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
