<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instructor Portal - EduAI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="navbar"></nav>

  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 32px; padding: 0 8px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
          <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
        </svg>
        <span style="font-size: 1.2rem; font-weight: 800;">Instructor Portal</span>
      </div>
      
      <a href="instructor-dashboard.html" class="sidebar-link active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg> Manage Courses
      </a>
      <a href="create-course.html" class="sidebar-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="16"></line>
          <line x1="8" y1="12" x2="16" y2="12"></line>
        </svg> Create Course
      </a>
      <a href="profile.html" class="sidebar-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg> My Profile
      </a>
      
      <button id="sidebar-logout-btn" class="sidebar-link" style="margin-top: auto;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg> Log Out
      </button>
    </aside>

    <!-- Main Panel Content -->
    <main class="main-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
        <div>
          <h1 style="font-size: 2.2rem;">Instructor Dashboard</h1>
          <p style="color: var(--text-secondary); margin-top: 4px;">Create and manage syllabus contents, approve quizzes, and monitor students</p>
        </div>
        <a href="create-course.html" class="btn btn-primary" style="display: inline-flex; gap: 8px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
          </svg> Create Course
        </a>
      </div>

      <!-- Info Grid Cards -->
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 40px;">
        <div class="glass-card" style="padding: 24px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 8px;">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
          <h4 style="color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase;">Active Courses</h4>
          <p id="stat-total" style="font-size: 2rem; font-weight: 800; margin-top: 8px; color: #fff;">0</p>
        </div>
        <div class="glass-card" style="padding: 24px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 8px;">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
          <h4 style="color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase;">Approved Listings</h4>
          <p id="stat-approved" style="font-size: 2rem; font-weight: 800; margin-top: 8px; color: #fff;">0</p>
        </div>
        <div class="glass-card" style="padding: 24px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 8px;">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <h4 style="color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase;">Pending Approvals</h4>
          <p id="stat-pending" style="font-size: 2rem; font-weight: 800; margin-top: 8px; color: #fff;">0</p>
        </div>
      </div>

      <!-- Courses Table Ledger -->
      <h2 style="font-size: 1.5rem; margin-bottom: 20px;">Your Courses</h2>

      <div id="instructor-courses-container">
        <div style="display: flex; justify-content: center; padding: 40px;">
          <div class="spinner"></div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="js/instructor.js"></script>
</body>
</html>
